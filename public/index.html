<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Portal</title>
<style>
  :root { color-scheme: dark; --acc:#7CFFB2; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#000; color:#e8e8e8; font:16px/1.5 system-ui, sans-serif; padding:24px; }
  main { width:100%; max-width:380px; display:grid; gap:14px; }
  h1 { margin:0 0 4px; font-weight:600; letter-spacing:.02em; }
  p { margin:0; color:#8a8a8a; font-size:14px; }
  input { font:inherit; color:inherit; background:#141414; border:1px solid #2c2c2c; border-radius:10px; padding:12px 14px; width:100%; letter-spacing:.12em; text-transform:lowercase; }
  a.btn { display:block; text-align:center; text-decoration:none; padding:14px; border-radius:12px; font-weight:600; }
  a.send { background:var(--acc); color:#000; }
  a.view { background:#141414; color:var(--acc); border:1px solid #2c2c2c; }
</style>
</head>
<body>
<main>
  <h1>Portal</h1>
  <p>Same room code on both phones. Open <b>Send</b> on the camera phone and <b>Hologram</b> on the display phone.</p>
  <input id="room" maxlength="32" autocomplete="off" spellcheck="false" aria-label="Room code">
  <a id="send" class="btn send" href="#">Send (camera phone)</a>
  <a id="view" class="btn view" href="#">Hologram (display phone)</a>
  <p>Anyone with the code can join the room, so keep it private.</p>
</main>
<script>
const el = document.getElementById("room");
let code = "";
try { code = localStorage.getItem("portal.room") || ""; } catch {}
if (!code) code = Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
el.value = code;
function upd() {
  const v = el.value.trim().replace(/[^A-Za-z0-9_-]/g, "");
  try { localStorage.setItem("portal.room", v); } catch {}
  document.getElementById("send").href = "/send?room=" + encodeURIComponent(v);
  document.getElementById("view").href = "/view?room=" + encodeURIComponent(v);
}
el.addEventListener("input", upd);
upd();
</script>
</body>
</html>
